[project]
name = "caveharness"
version = "0.1.0"
description = "Run harness for the Cave or hold study: eight-turn Inspect task, Never/After branching, blinded export"
readme = "README.md"
authors = [
    { name = "MokshitSurana", email = "msura4@uic.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "inspect-ai>=0.3.289",
    "linearmodels>=7.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.entry-points.inspect_ai]
caveharness = "caveharness._registry"

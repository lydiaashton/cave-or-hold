# Only branches.csv is copied in (via Sample.files). Nothing from the host is
# mounted, so answer_key/, generator/ and the folder names are unreachable,
# and the host's environment variables (API keys) are not inherited.
# No network: the model cannot install packages or reach anything outside.
services:
  default:
    build:
      context: .
    image: caveharness-sandbox:1
    init: true
    command: tail -f /dev/null
    network_mode: none
    working_dir: /work
    cpus: 1.0
    mem_limit: 2gb

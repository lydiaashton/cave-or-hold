# Only branches.csv is copied in (via Sample.files). Nothing from the host is
# mounted, so answer_key/, generator/ and the folder names are unreachable,
# and the host's environment variables (API keys) are not inherited.
# No network: the model cannot install packages or reach anything outside.
# Read-only except /work and /tmp (in-memory) and Docker's own /dev/shm, so
# everything the model's code can write is where the harness lists "files
# saved" and restores for the After branch (task.py WRITE_ROOTS; /dev/mqueue
# is also writable but holds no files). HOME and MPLCONFIGDIR point into /tmp so
# matplotlib has a writable cache and prints no warning (/tmp/mpl is not
# restored or listed: it is the library's cache, not the model's).
services:
  default:
    build:
      context: .
    image: caveharness-sandbox:1
    init: true
    command: tail -f /dev/null
    network_mode: none
    working_dir: /work
    read_only: true
    tmpfs:
      - /work
      - /tmp
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/mpl
    cpus: 1.0
    mem_limit: 2gb

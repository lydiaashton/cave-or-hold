# Token prices for the cost estimates in the pilot report and the judge report
# (handoff sections 4 and 9). Per million tokens, keyed by the model string as
# it appears in the run logs and judge outputs. A model without an entry is
# reported as "price not set", never as zero.
#
# unit: whatever the price table is in ("USD", "Adaption credits", ...). Costs
# in different units are never added together.
# cache_read is optional; without it cache reads are priced as input (an upper
# bound). cache_write is needed for any model that reports cache writes
# (Anthropic), or its cost shows as "price not set". Inspect counts both apart
# from input tokens.
#
# Adaption: credits per million tokens from the Adaption price table (study lead, 14 Nov 2026);
# cached input in cache_read. Anthropic: USD per million tokens from Anthropic's pricing (study
# lead, 14 Nov); cache_write is the 5-minute cache-write rate (the 1-hour rate is $8 Opus, $4 Sonnet).
# OpenAI price still to fill in.


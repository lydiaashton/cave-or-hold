name: Build paper

on:
  pull_request:
    paths: ['paper/**']
  push:
    branches: [main]
    paths: ['paper/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/main.pdf
